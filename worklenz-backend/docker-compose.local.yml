services:
  pms-seconova-backend:
    image: pms-seconova-backend:local
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: pms-seconova-backend-local
    env_file:
      - .env
    ports:
      - ${PORT}:${PORT}
    volumes:
      - .:/backend/
      - ./.env:/backend/.env:ro
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - kakushibe_ikki
    restart: unless-stopped

networks:
  kakushibe_ikki:
    external: true
